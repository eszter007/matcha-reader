name: Bug Report
description: Report an issue or unexpected behavior
labels: ["bug"]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Which device does this happen on?
      options:
        - Xteink X3
        - Xteink X4
        - Xteink X4 Classic
        - Xteink X4 Pro
        - Seeed Sticky
        - M5Stack Paper Mono
        - Metalio 3.97"
        - EEGO A4
        - BOOX Picco
        - iOS / desktop simulator
        - Other / not listed
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings, or the commit you built from.
      placeholder: e.g. 1.5.1
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder:
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Clearly list the steps necessary to reproduce the unexpected behavior.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Crash
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Serial log output or photos of the screen, if you have them. To capture a log, connect the device by USB and use the [logging tool](https://eszter007.github.io/crosspoint-logging/) in Chrome or Edge. For a lookup problem, include the book's language and the word.
      render: shell
