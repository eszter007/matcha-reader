name: Build & Publish Chinese Dictionary Packs

# Ready-made /dictionaries/zh folders, so a Chinese reader unzips one onto the card instead of
# running the converter. Two packs, both from CC-CEDICT with both scripts indexed, differing in
# what a mainland and a Taiwanese learner want beside it. Run manually; the sources change
# slowly. Publishes to this repository's releases under a dated tag plus a stable one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download sources
        run: |
          mkdir -p src
          cd src
          curl -sSL -o cedict.txt.gz https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
          curl -sSL -o jieba-dict.txt https://raw.githubusercontent.com/fxsjy/jieba/master/jieba/dict.txt
          curl -sSL -o hsk30.csv https://raw.githubusercontent.com/ivankra/hsk30/master/hsk30.csv
          curl -sSL -o tocfl.csv https://raw.githubusercontent.com/ivankra/tocfl/master/tocfl-202307.csv
          curl -sSL -o dict-revised.json.xz https://raw.githubusercontent.com/g0v/moedict-data/master/dict-revised.json.xz
          curl -sSL -o cmn_sentences.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2
          curl -sSL -o eng_sentences.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2
          curl -sSL -o cmn-eng_links.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/cmn/cmn-eng_links.tsv.bz2
          ls -la

      - name: Build Tatoeba sentence pairs
        run: python3 tools/dict_convert/tatoeba_pairs.py src/cmn_sentences.tsv.bz2 src/eng_sentences.tsv.bz2 src/cmn-eng_links.tsv.bz2 src/pairs.tsv

      - name: Build simplified pack
        run: |
          python3 tools/dict_convert/convert_jmdict.py --lang zh \
            --input src/cedict.txt.gz --frequency src/jieba-dict.txt --split-names \
            --levels src/hsk30.csv --level-name HSK --examples src/pairs.tsv --examples-script simplified \
            --output-dir packs/simplified/dictionaries/zh

      - name: Build traditional pack
        run: |
          python3 tools/dict_convert/convert_jmdict.py --lang zh --zhuyin --split-names \
            --input src/cedict.txt.gz --input src/dict-revised.json.xz \
            --frequency src/tocfl.csv --levels src/tocfl.csv --level-name TOCFL \
            --examples src/pairs.tsv --examples-script traditional \
            --output-dir packs/traditional/dictionaries/zh

      - name: Write attributions and zip
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_ENV"
          for pack in simplified traditional; do
            cat > "packs/$pack/README.txt" <<NOTE
          Matcha Reader Chinese dictionary pack ($pack), built $DATE.

          Copy the "dictionaries" folder to the root of the SD card (or rename it ".dictionaries").
          Install only one pack: both go in dictionaries/zh.

          Sources and licences:
            CC-CEDICT (MDBG), CC BY-SA 4.0 - https://www.mdbg.net/chinese/dictionary?page=cc-cedict
            Tatoeba example sentences, CC BY 2.0 FR - https://tatoeba.org
          NOTE
            if [ "$pack" = simplified ]; then
              cat >> "packs/$pack/README.txt" <<NOTE
            jieba word frequencies, MIT - https://github.com/fxsjy/jieba
            HSK 3.0 word list, via https://github.com/ivankra/hsk30 (MIT)
          NOTE
            else
              cat >> "packs/$pack/README.txt" <<NOTE
            教育部重編國語辭典修訂本, CC BY-ND 3.0 TW, text unchanged - https://github.com/g0v/moedict-data
            TOCFL 華語八千詞, via https://github.com/ivankra/tocfl
          NOTE
            fi
            (cd "packs/$pack" && zip -qr "../../dictionaries-zh-$pack-$DATE.zip" .)
          done
          ls -la *.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dictionaries-zh-${{ env.date }}"
          NOTES="Ready-made Chinese dictionaries for Matcha Reader. Unzip one pack onto the SD card so that it holds \`dictionaries/zh/\`.

          - **simplified**: CC-CEDICT ranked by jieba word frequency, HSK 3.0 level tags, proper nouns in the names dictionary, Tatoeba examples.
          - **traditional**: the same with zhuyin beside the pinyin, the MoE 重編國語辭典 merged in, TOCFL levels and ranking.

          See the README inside each zip for sources and licences."
          gh release create "$TAG" dictionaries-zh-*.zip --title "Chinese dictionaries ($TAG)" --notes "$NOTES"
          gh release delete dictionaries-zh --yes 2>/dev/null || true
          git push --delete origin dictionaries-zh 2>/dev/null || true
          gh release create dictionaries-zh dictionaries-zh-*.zip --title "Chinese dictionaries (latest)" \
            --notes "Latest build; see $TAG for the dated copy.

          $NOTES"
